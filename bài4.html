<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xử lý tên sách</title>
</head>
<body>
    <script>
        let tenSach = prompt("Nhập tên một cuốn sách:");
        console.log("Tên gốc: " + tenSach);
        console.log("Tên viết thường: " + tenSach.toLowerCase());
        console.log("Tên viết hoa: " + tenSach.toUpperCase());
    </script>
</body>
</html>
