<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý mượn sách thư viện</title>
</head>
<body>
    <script>
        let tenSach = prompt("Nhập tên sách:");
        let tenNguoiMuon = prompt("Nhập tên người mượn:");
        let trangThaiSach = prompt("Nhập tình trạng sách (có sẵn / đã mượn / không có sẵn):");
        let soNgayMuon = Number(prompt("Nhập số ngày mượn:"));
        let coTheThuVien = prompt("Bạn có thẻ thư viện không? (có / không):");

        if (trangThaiSach === "có sẵn" && coTheThuVien === "có") {
            alert("Chúc mừng, bạn có thể mượn sách này");
        } else if (trangThaiSach === "đã mượn" && soNgayMuon < 30) {
            if (coTheThuVien === "có") {
                alert("Sách đang được mượn, vui lòng đợi đến khi trả lại");
            } else {
                alert("Bạn không thể mượn sách nếu không có thẻ thư viện");
            }
        } else if (trangThaiSach === "không có sẵn") {
            alert("Sách này hiện tại không có sẵn trong thư viện, bạn có thể đăng ký mượn sau");
        } else {
            alert("Thông tin không hợp lệ, vui lòng nhập lại");
        }
    </script>
</body>
</html>
