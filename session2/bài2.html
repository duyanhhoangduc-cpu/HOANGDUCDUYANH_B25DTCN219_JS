<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý số lượng sách</title>
</head>
<body>
    <script>
        let soLuongSach = Number(prompt("Nhập số lượng sách trong thư viện:"));

        if (soLuongSach < 10) {
            alert("Thư viện có ít sách");
        } else if (soLuongSach >= 10 && soLuongSach <= 20) {
            alert("Thư viện có số lượng sách vừa đủ");
        } else {
            alert("Thư viện có nhiều sách");
        }
    </script>
</body>
</html>
