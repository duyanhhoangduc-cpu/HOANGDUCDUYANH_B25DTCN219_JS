<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let squad = [
    { id: 1, name: "Nguyen Van A", position: "FW", goals: 10 },
    { id: 2, name: "Tran Van B", position: "MF", goals: 5 },
    { id: 3, name: "Le Van C", position: "DF", goals: 2 }
];


function showSquad() {
    console.log("=== DANH SÁCH ĐỘI HÌNH ===");

    if (squad.length === 0) {
        console.log("Đội bóng hiện đang trống.");
        return;
    }

    squad.forEach(player => {
        console.log(`Mã ${player.id} - ${player.name} (${player.position}): ${player.goals} bàn`);
    });
}


function addPlayer() {
    let name = prompt("Nhập tên cầu thủ:");
    let goals = Number(prompt("Nhập số bàn thắng:"));
    let position = prompt("Nhập vị trí:");

    let newPlayer = {
        id: squad.length > 0 ? squad[squad.length - 1].id + 1 : 1,
        name: name,
        position: position,
        goals: goals
    };

    squad.push(newPlayer);

    console.log("=> Đã thêm cầu thủ thành công!");
}


function findPlayer() {
    let id = Number(prompt("Nhập ID cầu thủ cần tìm:"));

    let player = squad.find(p => p.id === id);

    if (player) {
        console.log("=== THÔNG TIN CẦU THỦ ===");
        console.log(`Mã ${player.id}`);
        console.log(`Tên: ${player.name}`);
        console.log(`Vị trí: ${player.position}`);
        console.log(`Bàn thắng: ${player.goals}`);
    } else {
        console.log("Không tìm thấy cầu thủ!");
    }
}


function updateGoals() {
    let id = Number(prompt("Nhập ID cầu thủ vừa ghi bàn:"));

    let player = squad.find(p => p.id === id);

    if (player) {
        player.goals += 1;
        console.log(`=> Đã cập nhật: ${player.name} hiện có ${player.goals} bàn thắng.`);
    } else {
        console.log("Không tìm thấy cầu thủ!");
    }
}


function deletePlayer() {
    let id = Number(prompt("Nhập ID cầu thủ cần xóa:"));

    let index = squad.findIndex(p => p.id === id);

    if (index !== -1) {
        let removed = squad.splice(index, 1);
        console.log(`=> Đã chuyển nhượng cầu thủ ${removed[0].name}`);
    } else {
        console.log("Không tìm thấy cầu thủ!");
    }
}


function menu() {
    let choice;

    do {
        choice = prompt(`
--- FOOTBALL MANAGER PRO ---

1. Xem đội hình
2. Thêm cầu thủ
3. Tìm kiếm (theo ID)
4. Cập nhật bàn thắng
5. Xóa cầu thủ (Chuyển nhượng)
0. Thoát

Bạn chọn:
        `);

        switch (choice) {
            case "1":
                showSquad();
                break;
            case "2":
                addPlayer();
                break;
            case "3":
                findPlayer();
                break;
            case "4":
                updateGoals();
                break;
            case "5":
                deletePlayer();
                break;
            case "0":
                console.log("Thoát chương trình...");
                break;
            default:
                console.log("Lựa chọn không hợp lệ!");
        }

    } while (choice !== "0");
}


menu();
    </script>
</body>
</html>
