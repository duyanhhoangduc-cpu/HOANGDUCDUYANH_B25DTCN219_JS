    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let students = [];

function generateTimestamp() {
  return Date.now(); //trả về thời gian hiện tại
}

function validateStudent({ id, name, age, gpa, status }) {
  if (!id || !name) return false;
  if (isNaN(age) || age < 16 || age > 60) return false;
  if (isNaN(gpa) || gpa < 0 || gpa > 10) return false;
  if (!["active", "inactive"].includes(status)) return false;
  if (students.some(s => s.id === id)) return false;
  return true;
}

function inputStudentData(isUpdate = false) {
  let id = prompt("Enter ID:");
  let name = prompt("Enter name:");
  let age = Number(prompt("Enter age (16-60):"));
  let gpa = Number(prompt("Enter GPA (0-10):"));
  let status = prompt("Enter status (active/inactive):");

  if (isUpdate) {
    return { id, name, age, gpa, status };
  }

  if (!validateStudent({ id, name, age, gpa, status })) {
    alert("Invalid data!");
    return null;
  }

  return {
    id,
    name,
    age,
    gpa,
    status,
    createdAt: generateTimestamp(),
    updatedAt: null,
    deletedAt: null
  };
}


function createStudent() {
  let student = inputStudentData();
  if (student) {
    students.push(student);
    alert("Created successfully!");
  }
}

function updateStudent() {
  let id = prompt("Enter ID to update:");
  let student = students.find(s => s.id === id);

  if (!student) {
    alert("Not found!");
    return;
  }

  let name = prompt("New name (leave blank to skip):");
  let age = prompt("New age:");
  let gpa = prompt("New gpa:");
  let status = prompt("New status:");

  if (name) student.name = name;
  if (age) student.age = Number(age);
  if (gpa) student.gpa = Number(gpa);
  if (status) student.status = status;

  student.updatedAt = generateTimestamp();
  alert("Updated!");
}

function softDeleteStudent() {
  let id = prompt("Enter ID to delete:");
  let student = students.find(s => s.id === id);

  if (!student) {
    alert("Not found!");
    return;
  }

  if (confirm("Are you sure?")) {
    student.status = "inactive";
    student.deletedAt = generateTimestamp();
    alert("Soft deleted!");
  }
}

function restoreStudent() {
  let id = prompt("Enter ID to restore:");
  let student = students.find(s => s.id === id);

  if (!student) {
    alert("Not found!");
    return;
  }

  student.status = "active";
  student.deletedAt = null;
  student.updatedAt = generateTimestamp();
  alert("Restored!");
}

function viewStudents() {
  let keyword = prompt("Search name:");
  let statusFilter = prompt("Filter status (active/inactive/all):");
  let sortOrder = prompt("Sort GPA (asc/desc):");

  let currentPage = 1;
  const perPage = 5; //số lượng phần tử hiển thị ở mỗi trang


  let pipelineData = [...students]; //... students toán tử spread để trải các ptu của mảng ra
                                    //Tạo một mảng mới chứa toàn bộ phần tử của students.
                                    //Không thay đổi mảng gốc
                                    // Dùng pipelineData để filter, sort, search
                                    // Sau đó vẫn giữ nguyên dữ liệu ban đầu

  if (keyword) {
    pipelineData = pipelineData.filter(s =>
      s.name.toLowerCase().includes(keyword.toLowerCase()) //tìm kiếm gần đúng
    );
  }


  if (statusFilter !== "all") {
    pipelineData = pipelineData.filter(s => s.status === statusFilter);
  }

  pipelineData = pipelineData.sort((a, b) =>
    sortOrder === "asc" ? a.gpa - b.gpa : b.gpa - a.gpa
  );

  let totalPages = Math.ceil(pipelineData.length / perPage);

  while (true) {
    let start = (currentPage - 1) * perPage;
    let pageData = pipelineData.slice(start, start + perPage);

    console.clear();
    console.log(`Page ${currentPage}/${totalPages}`);
    console.table(pageData);

    let nav = prompt("First/Last/Next/Prev/Exit").toLowerCase();

    if (nav === "first") currentPage = 1;
    else if (nav === "last") currentPage = totalPages;
    else if (nav === "next" && currentPage < totalPages) currentPage++;
    else if (nav === "prev" && currentPage > 1) currentPage--;
    else if (nav === "exit") break;
  }
}



function analyticsDashboard() {
  if (students.length === 0) {
    alert("No data!");
    return;
  }

  let overview = students.reduce(
    (acc, s) => {
      acc.total++;
      if (s.status === "active") acc.active++;
      else acc.inactive++;
      acc.totalGpa += s.gpa;

      if (s.gpa === 0) acc.zeroGpa.push(s);
      if (s.gpa < 3) acc.risk.push(s);

      return acc;
    },
    {
      total: 0,
      active: 0,
      inactive: 0,
      totalGpa: 0,
      zeroGpa: [],
      risk: []
    }
  );

  let avgGpa = overview.totalGpa / overview.total;

  let topGpa = [...students]
    .sort((a, b) => b.gpa - a.gpa)
    .slice(0, 5);

  let youngest = [...students]
    .sort((a, b) => a.age - b.age)
    .slice(0, 5);

  console.clear();
  console.log("===== DASHBOARD =====");
  console.log("Total:", overview.total);
  console.log("Active:", overview.active);
  console.log("Inactive:", overview.inactive);
  console.log("Average GPA:", avgGpa.toFixed(2));
  console.log("Risk count:", overview.risk.length);

  console.log("Top 5 GPA");
  console.table(topGpa);

  console.log("Top 5 Youngest");
  console.table(youngest);

  console.log("GPA = 0");
  console.table(overview.zeroGpa);

  console.log("GPA < 3");
  console.table(overview.risk);
}


function main() {
  let choice;

  do {
    choice = prompt(`
==== STUDENT MANAGER ADVANCED ====
1. Create Student
2. Update Student
3. Soft Delete Student
4. Restore Student
5. View Students
6. Analytics Dashboard
7. Exit
    `);

    switch (choice) {
      case "1":
        createStudent();
        break;
      case "2":
        updateStudent();
        break;
      case "3":
        softDeleteStudent();
        break;
      case "4":
        restoreStudent();
        break;
      case "5":
        viewStudents();
        break;
      case "6":
        analyticsDashboard();
        break;
      case "7":
        alert("Goodbye!");
        break;
      default:
        alert("Invalid choice!");
    }
  } while (choice !== "7");
}

main();
    </script>
</body>
</html>
</body>
</html>
