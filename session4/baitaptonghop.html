<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let correctPassword = "admin123";
let attempts = 0;
let maxAttempts = 3;
let isLogin = false;

while (attempts < maxAttempts) {
    let password = prompt("Nhập mật khẩu đăng nhập:");

    if (password === correctPassword) {
        alert("Đăng nhập thành công");
        isLogin = true;
        break;
    } else {
        attempts++;
        alert("Sai mật khẩu! Bạn còn " + (maxAttempts - attempts) + " lần thử.");
    }
}

if (!isLogin) {
    alert("Hệ thống bị khóa");
} else {

    while (true) {
        let choice = prompt(
            "----- MENU -----\n" +
            "1. Nhập lô sách mới\n" +
            "2. Vẽ sơ đồ kệ sách\n" +
            "3. Thoát\n" +
            "Nhập lựa chọn (1-3):"
        );


        if (choice === "1") {
            let n = Number(prompt("Bạn muốn nhập bao nhiêu cuốn sách?"));
            let total = 0;

            for (let i = 1; i <= n; i++) {
                let price = Number(prompt("Nhập giá tiền cuốn sách thứ " + i + ":"));

                if (price <= 0) {
                    alert("Giá tiền không hợp lệ, bỏ qua cuốn này!");
                    continue;
                }

                total += price;
            }

            alert("Tổng giá trị nhập kho đợt này là: " + total);

  
        } else if (choice === "2") {
            for (let khu = 1; khu <= 3; khu++) {
                for (let ke = 1; ke <= 5; ke++) {
                    if (khu === 2 && ke === 3) {
                        console.log("Khu vực 2 - Kệ 3 (Đang sửa chữa)");
                        continue;
                    }
                    console.log("Khu vực " + khu + " - Kệ " + ke);
                }
            }

    
        } else if (choice === "3") {
            alert("Hẹn gặp lại!");
            break;

        } else {
            alert("Lựa chọn không hợp lệ!");
        }
    }
}

    </script>
</body>
</html>
