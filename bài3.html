<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tổng số sách</title>
</head>
<body>
    <script>
        let sachCu = Number(prompt("Nhập số sách cũ:"));
        let sachMoi = Number(prompt("Nhập số sách mới nhập:"));
        let tongSach = sachCu + sachMoi;
        document.write("Tổng số sách hiện tại: " + tongSach);
    </script>
</body>
</html>
