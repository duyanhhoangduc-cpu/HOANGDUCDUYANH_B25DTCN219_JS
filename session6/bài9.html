<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Menu mảng</title>
</head>
<body>
    <script>
        let arr = [];

        while (true) {
            let choice = prompt(
`================== MENU ===================
1. Nhập số phần tử và giá trị các phần tử
2. In ra các phần tử đang quản lý
3. In ra các phần tử chẵn và tính tổng
4. In ra giá trị lớn nhất và nhỏ nhất
5. Thoát
===========================================
Lựa chọn của bạn:`);

            if (choice == 1) {
                let n = Number(prompt("Nhập số phần tử"));
                arr = [];
                for (let i = 0; i < n; i++) {
                    arr.push(Number(prompt("Nhập phần tử")));
                }
            } 
            else if (choice == 2) {
                console.log(arr);
            } 
            else if (choice == 3) {
                let sum = 0;
                let even = [];
                for (let i = 0; i < arr.length; i++) {
                    if (arr[i] % 2 === 0) {
                        even.push(arr[i]);
                        sum += arr[i];
                    }
                }
                console.log(even);
                console.log("Tổng:", sum);
            } 
            else if (choice == 4) {
                if (arr.length === 0) {
                    console.log("Mảng rỗng");
                } else {
                    let max = arr[0];
                    let min = arr[0];
                    for (let i = 1; i < arr.length; i++) {
                        if (arr[i] > max) max = arr[i];
                        if (arr[i] < min) min = arr[i];
                    }
                    console.log("Max:", max);
                    console.log("Min:", min);
                }
            } 
            else if (choice == 5) {
                break;
            } 
            else {
                alert("Lựa chọn không hợp lệ");
            }
        }

        d
    </script>
</body>
</html>
