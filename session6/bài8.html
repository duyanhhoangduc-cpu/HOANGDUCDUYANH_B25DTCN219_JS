<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Fibonacci</title>
</head>
<body>
    <script>
        let n = Number(prompt("Nhập n"));

        if (n < 0) {
            console.log("Số lượng phần tử không được nhỏ hơn 0");
        } else if (n === 0) {
            console.log("Không phải dãy số fibonacci");
        } else {
            let arr = [];

            for (let i = 0; i < n; i++) {
                arr.push(Number(prompt("Nhập phần tử")));
            }

            let isFib = true;

            if (n < 3) {
                isFib = false;
            } else {
                for (let i = 2; i < n; i++) {
                    if (arr[i] !== arr[i - 1] + arr[i - 2]) {
                        isFib = false;
                        break;
                    }
                }
            }

            if (isFib) {
                console.log("Là dãy số fibonacci");
            } else {
                console.log("Không phải dãy số fibonacci");
            }
        }
    </script>
</body>
</html>
