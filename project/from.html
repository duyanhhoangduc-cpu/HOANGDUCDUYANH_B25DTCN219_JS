<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Article</title>
    <link rel="stylesheet" href="../CSS/from.css">
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>📝 Add New Article</h2>
            <span class="close-btn"><a href="../HTML/article_manager.html">x</a></span>
        </div>

        <form>
            <div class="form-group">
                <label>Title:</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Article Categories:</label>
                <input type="text" class="gray-bg">
            </div>

            <div class="form-group">
                <label>Mood:</label>
                <div class="select-wrapper">
                    <input type="text" value="😀 Happy" class="gray-bg" readonly>
                </div>
            </div>

            <div class="form-group">
                <label>Content:</label>
                <textarea rows="4"></textarea>
            </div>

            <div class="form-group inline">
                <label>Status</label>
                <div class="radio-group">
                    <input type="radio" name="status" id="public"> <label for="public">public</label>
                    <input type="radio" name="status" id="private"> <label for="private">private</label>
                </div>
            </div>

            <div class="upload-area">
                <div class="upload-icon">☁️</div>
                <p>Browse and chose the files you want to upload from your computer</p>
            </div>

            <button type="submit" class="add-btn">Add</button>
        </form>
    </div>

</body>
</html>
