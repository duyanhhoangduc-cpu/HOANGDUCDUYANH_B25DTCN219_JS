<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const players = [
    "Messi - Forward - 25 - 15",
    "Ronaldo - Forward - 30 - 10",
    "Neymar - Forward - 18 - 20",
    "De Bruyne - Midfielder - 8 - 25",
    "Kante - Midfielder - 2 - 5",
    "Van Dijk - Defender - 5 - 3",
    "Alisson - Goalkeeper - 0 - 1",
];

function reportTopPerformers(minPerformance, players) {
    const total = players
        .map(player => {
            const parts = player.split(" - ");
            const name = parts[0];
            const goals = parseInt(parts[2]);
            const assists = parseInt(parts[3]);
            return { name, performance: goals + assists };
        })
        .filter(player => player.performance >= minPerformance)
        .map(player => {
            console.log(`${player.name}: ${player.performance}`);
            return player.performance;
        })
        .reduce((sum, performance) => sum + performance, 0);

    console.log(`Tổng hiệu suất: ${total}`);
    return total;
}

reportTopPerformers(30, players);
reportTopPerformers(20, players);
reportTopPerformers(50, players);
    </script>
</body>
</html>
