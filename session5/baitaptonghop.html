<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý thư viện</title>
</head>
<body>
<script>
    let books = ["Nha Gia Kim", "Dac Nhan Tam", "Tuan Lam Viec 4 Gio"];
    let choice;

    do {
        choice = prompt(
`--- THƯ VIỆN KHOA HỌC ---
1. Xem danh sách
2. Nhập sách mới
3. Mượn sách (Xóa)
4. Sửa tên sách
5. Sắp xếp kệ
0. Thoát

Bạn chọn:`
        );

        switch (choice) {
            case "1": {
                if (books.length === 0) {
                    alert("Kho sách đang trống!");
                } else {
                    let list = "";
                    for (let i = 0; i < books.length; i++) {
                        list += (i + 1) + ". " + books[i] + "\n";
                    }
                    alert(`=> Danh sách hiện tại (${books.length} cuốn):\n\n${list}`);
                }
                break;
            }

            case "2": {
                let newBook = prompt("Nhập tên sách mới:");
                if (newBook && newBook.trim() !== "") {
                    books.push(newBook.trim());
                    alert("Đã thêm thành công!");
                } else {
                    alert("Tên sách không hợp lệ!");
                }
                break;
            }

            case "3": {
                let borrowBook = prompt("Nhập tên sách muốn mượn:");
                let index = books.indexOf(borrowBook);

                if (index === -1) {
                    alert(`=> Lỗi: Không tìm thấy sách ${borrowBook}!`);
                } else {
                    books.splice(index, 1);
                    alert(`=> Đã cho mượn cuốn '${borrowBook}'.`);
                }
                break;
            }

            case "4": {
                let oldName = prompt("Nhập tên sách cần sửa:");
                let index = books.indexOf(oldName);

                if (index === -1) {
                    alert("Không tìm thấy sách cần sửa!");
                } else {
                    let newName = prompt("Nhập tên sách mới:");
                    if (newName && newName.trim() !== "") {
                        books[index] = newName.trim();
                        alert("Cập nhật sách thành công!");
                    } else {
                        alert("Tên sách mới không hợp lệ!");
                    }
                }
                break;
            }

            case "5": {
                books.sort();
                let list = "";
                for (let i = 0; i < books.length; i++) {
                    list += (i + 1) + ". " + books[i] + "\n";
                }
                alert("=> Danh sách sau khi sắp xếp:\n\n" + list);
                break;
            }

            case "0":
                alert("Đã thoát chương trình!");
                break;

            default:
                alert("Lựa chọn không hợp lệ!");
        }

    } while (choice !== "0");
</script>
</body>
</html>
