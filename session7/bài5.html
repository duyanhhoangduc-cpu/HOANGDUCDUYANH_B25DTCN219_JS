<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let players = [
    "P001-Nguyen Van A-Thủ môn",
    "P002-Tran Van B-Hậu vệ",
    "P003-Le Van C-Tiền đạo",
    "P004-Pham Van D-Tiền đạo",
    "P005-Hoang Van E-Tiền vệ",
    "P006-Do Van F-Thủ môn"
];

function getAllPositions() {
    let positions = [];
    for (let i = 0; i < players.length; i++) {
        let position = players[i].split("-")[2];
        if (!positions.includes(position)) {
            positions.push(position);
        }
    }
    return positions;
}

function findPlayersWithLongestName() {
    let longestName = "";
    for (let i = 0; i < players.length; i++) {
        let name = players[i].split("-")[1];
        if (name.length > longestName.length) {
            longestName = name;
        }
    }
    return longestName;
}

function countPlayersStartingWithLetter(letter) {
    let count = 0;
    letter = letter.toLowerCase();

    for (let i = 0; i < players.length; i++) {
        let name = players[i].split("-")[1];
        if (name.toLowerCase().startsWith(letter)) {
            count++;
        }
    }
    return count;
}

console.log("Các vị trí trong đội:");
console.log(getAllPositions());

console.log("\nCầu thủ có tên dài nhất:");
console.log(findPlayersWithLongestName());

console.log("\nSố cầu thủ có tên bắt đầu bằng chữ 'N':");
console.log(countPlayersStartingWithLetter("N"));

    </script>
</body>
</html>
